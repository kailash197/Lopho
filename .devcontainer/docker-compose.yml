services:
  lopho-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: lopho-dev-img
    container_name: lopho_dev_container
    privileged: true
    user: vscode
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - LIBGL_ALWAYS_SOFTWARE=1  # Fallback if GPU access fails
      - QT_QUICK_BACKEND=software
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
    devices:
      - /dev/dri:/dev/dri           # for OpenGL on Intel/AMD
    network_mode: host
    stdin_open: true
    tty: true

